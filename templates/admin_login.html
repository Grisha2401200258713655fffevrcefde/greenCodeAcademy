{% extends 'base.html' %}
{% block title %}Вход администратора{% endblock %}
{% block content %}
<div class="row justify-content-center py-5"><div class="col-md-7 col-lg-5">
<div class="card bg-dark shadow-lg rounded-4"><div class="card-body p-4 p-lg-5">
<h1 class="h3 text-center mb-2">Админ-панель</h1>
<p class="text-secondary text-center mb-4">Green Code Academy · Доступ для администратора</p>
<form method="post" action="{{ url_for('admin_login') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label" for="admin-username">Логин</label>
<input class="form-control mb-3" type="text" name="username" id="admin-username" autocomplete="username" maxlength="50" required autofocus>
<label class="form-label" for="admin-password">Пароль</label>
<input class="form-control mb-4" type="password" name="password" id="admin-password" autocomplete="current-password" required>
<button class="btn btn-success w-100" type="submit">Войти в админку</button>
</form></div></div></div></div>
{% endblock %}
