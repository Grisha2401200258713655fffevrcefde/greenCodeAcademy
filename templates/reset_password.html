{% extends "base.html" %}{% block title %}Новый пароль{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-lg-5"><h1>Новый пароль</h1>
<form method="post" action="{{ url_for('reset_password', token=token) }}" class="card bg-dark p-4">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label" for="password">Новый пароль (не менее 12 символов)</label><input class="form-control mb-3" id="password" type="password" name="password" minlength="12" maxlength="128" required autocomplete="new-password">
<label class="form-label" for="confirm">Повторите пароль</label><input class="form-control mb-3" id="confirm" type="password" name="confirm" minlength="12" maxlength="128" required autocomplete="new-password">
<button class="btn btn-success" type="submit">Изменить пароль</button></form></div></div>{% endblock %}
