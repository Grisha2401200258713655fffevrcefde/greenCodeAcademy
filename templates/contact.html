{% extends 'base.html' %}{% block title %}Обратная связь{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><h1>Связаться с Green Code Academy</h1><p class="text-secondary">Есть вопрос об обучении? Отправь сообщение.</p><form method="post" action="{{ url_for('contact') }}" class="card bg-dark p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Имя</label><input class="form-control mb-3" name="name" maxlength="80" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" maxlength="120" required><label class="form-label">Сообщение</label><textarea class="form-control mb-3" name="message" rows="6" maxlength="4000" required></textarea><button class="btn btn-success" type="submit">Отправить</button></form></div></div>{% endblock %}
