{% extends "base.html" %}{% block title %}Подтверждение email{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-lg-5"><h1>Подтверждение email</h1>
<form action="{{ url_for('resend_verification') }}" method="post" class="card bg-dark p-4">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" name="email" type="email" maxlength="120" required>
<button class="btn btn-success" type="submit">Отправить письмо повторно</button></form></div></div>{% endblock %}
