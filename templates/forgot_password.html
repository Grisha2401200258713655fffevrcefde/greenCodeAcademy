{% extends "base.html" %}{% block title %}Восстановление пароля{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-lg-5"><h1>Восстановление пароля</h1>
<p class="text-secondary">Введите email, который вы использовали при регистрации.</p>
<form action="{{ url_for('forgot_password') }}" method="post" class="card bg-dark p-4">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" name="email" type="email" required maxlength="120" autocomplete="email">
<button class="btn btn-success" type="submit">Отправить ссылку</button></form>
<p class="small text-secondary mt-3">Для отправки писем на сервере должны быть настроены SMTP и PUBLIC_BASE_URL.</p></div></div>{% endblock %}
