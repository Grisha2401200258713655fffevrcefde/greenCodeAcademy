name: academy-checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/academy-modernization-2026-11]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q app.py config.py tests
      - name: Run integration tests
        env:
          SECRET_KEY: "unit-test-secret-key-unique-and-long-enough-123456789"
          DATABASE_URL: "sqlite:///:memory:"
          SESSION_COOKIE_SECURE: "false"
          REQUIRE_EMAIL_VERIFICATION: "false"
          PUBLIC_BASE_URL: "http://localhost:5000"
        run: python -m pytest -q --disable-warnings --maxfail=1
